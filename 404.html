<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · 页面走丢了</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: var(--space-3); }
    .nf__code { font-size: clamp(80px, 18vw, 180px); font-weight: 700; letter-spacing: -0.03em; line-height: 1; margin: 0; }
    .nf__msg { font-size: 22px; color: var(--text-secondary); margin: var(--space-2) 0 var(--space-4); }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <p class="nf__code">404</p>
      <p class="nf__msg">这个页面走丢了。</p>
      <a class="btn btn--primary" href="/">回到主页</a>
    </div>
  </main>
  <script>
    (function () {
      var s = localStorage.getItem("theme");
      var d = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", s || (d ? "dark" : "light"));
    })();
  </script>
</body>
</html>
